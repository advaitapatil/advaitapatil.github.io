  <style>
    :root {
      --paper: #fbfaf8;
      --ink: #1c1b17;
      --ink-soft: #545149;
      --ink-faint: #928e83;
      --rule: #e6e3db;
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14130f;
        --ink: #ece9e0;
        --ink-soft: #a7a298;
        --ink-faint: #6f6b61;
        --rule: #2a2822;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.62;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 8vh 1.75rem 3rem;
      animation: rise 0.7s cubic-bezier(0.2, 0.6, 0.2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.25rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--rule);
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 500;
      letter-spacing: -0.018em;
      line-height: 1.08;
    }
    .place {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--ink-faint);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .lede {
      margin-top: 1.35rem;
      font-size: 1.12rem;
      line-height: 1.58;
      color: var(--ink);
      text-wrap: pretty;
    }
    .lede + .lede { margin-top: 0.9rem; }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-underline-offset: 0.16em;
      text-decoration-thickness: 1px;
      transition: text-decoration-color 0.25s ease, color 0.25s ease;
    }
    a:hover { text-decoration-color: currentColor; }
    a:focus-visible {
      outline: 2px solid var(--ink-soft);
      outline-offset: 3px;
      border-radius: 1px;
    }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }

    .links {
      margin-top: 2.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 1.6rem;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
    }
    .links a {
      color: var(--ink-soft);
      text-decoration-color: transparent;
      white-space: nowrap;
    }
    .links a:hover { color: var(--ink); text-decoration-color: currentColor; }

    @media (max-width: 34rem) {
      main { padding: 9vh 1.4rem 3rem; }
      h1 { font-size: 1.9rem; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
      .links {
        flex-direction: column;
        gap: 0.7rem;
      }
    }
  </style>
